# FEATURES
# ========
# - Set @window_flair to add something to a window's name like a bell
#   icon, when a process requires attention.
# - Window title is "<parent_dir>:<command>"
# - "Magical" theme based on Tokyo Night and using patched Nerd Fonts
# - General QoL improvements
#
# REQUIREMENTS
# ============
# - Patched Nerd Font (rec. FantasqueSansM): https://www.nerdfonts.com/





### ===============
### Quality of Life
### ===============

set -g history-limit 50000

# Number windows and panes starting at 1 to match keyboard
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows to prevent gaps when closing
set -g renumber-windows on

# Redraw status line every second for fast window name updates
set-option -g status-interval 1

# Auto-rename windows to base current path and current command
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}:#{pane_current_command}'





### ========
### Bindings
### ========

# Rebind prefix as C-z
unbind C-b
unbind C-c
set -g prefix C-z
bind C-z send-prefix

# Rebind split-window to | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Bind "r" to reload config
bind r source-file ~/.tmux.conf

# Turn mouse interaction on
set -g mouse on

# Input line feed via Shift-Enter
bind-key -T root S-Enter send-keys C-j





### ==========
### Aesthetics
### ==========

#set-option -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"

# pane_* is the pane border separator
set -g @pane_l ""        # nf-pl-right_hard_divider                 U+E0B2
set -g @pane_r ""        # nf-pl-left_hard_divider                  U+E0B0

# sep_* is the inactive tab separator
set -g @sep_l ""         # nf-ple-backslash_separator               U+E0B9
set -g @sep_r ""         # nf-ple-forwardslash_separator            U+E0BB

# tab_* is the active tab separator
set -g @tab_l ""         # nf-ple-upper_right_triangle              U+E0BE
set -g @tab_r ""         # nf-ple-upper_left_triangle               U+E0BC

# status_sep_* is the separator for the left and right status
set -g @status_sep_l ""  # nf-ple-pixelated_squares_small           U+E0C4
set -g @status_sep_r ""  # nf-ple-pixelated_squares_small_mirrored  U+E0C5

# General decor
set -g @dec_scroll ""    # nf-oct-log                               U+F4ED
set -g @dec_sparkles "󰙴" # nf-weather-stars (U+E370) / nf-md-creation (U+DB81 U+DE74)

# Colors from: https://github.com/zatchheems/tokyo-night-alacritty-theme/blob/main/tokyo-night.yaml
set -g @pane_bg            "#ad8ee6" # lavender
set -g @pane_fg            "#32344a" # navy
set -g @status_bg          "#7aa2f7" # periwinkle
set -g @status_fg          "#32344a" # navy
set -g @status_line_bg     "#32344a" # navy
set -g @status_line_fg     "#bb9af7" # magenta
set -g @window_current_bg  "#ad8ee6" # lavender
set -g @window_current_fg  "#1a1b26" # black "#282828" # black
set -g @window_bg          "#414868" # muted slate "#504945" # taupe
set -g @window_fg          "#ad8ee6" # lavender

set -g status-style "bg=#{@status_line_bg},fg=#{@status_line_fg}"

# Magical left status w/ session_name
set -g status-left "#[bg=#{@status_bg},fg=#{@status_fg}] #{@dec_scroll}  #{session_name} #[bg=#{@status_fg},fg=#{@status_bg}]#{@status_sep_l}"
set -g status-left-length 0

# Magical right status starry decor
set -g status-right "#[bg=#{@status_fg},fg=#{@status_bg}]#{@status_sep_r} #[bg=#{@status_bg},fg=#{@status_fg}] #{@dec_sparkles}  "
set -g status-right-length 20

set -g window-status-separator ""

# Tab-like window names
# @window_flair is here so that processes can add some flair to the
# window to indicate status. It is cleared on navigation to the
# window.
set -g window-status-format "#{?#{>:#{window_index},#{e|+:#{active_window_index},1}},#[fg=#{@window_fg} bg=#{@window_bg}]#{@sep_r},#[bg=#{@window_bg}] }#[bg=#{@window_bg}]#{window_index} #{window_name}#{@window_flair}#{?#{==:#{window_index},#{session_windows}},#[bg=#{@status_line_bg} fg=#{@window_bg}]#{@tab_r},#{?#{<:#{window_index},#{e|-:#{active_window_index},1}},#[fg=#{@window_fg} bg=#{@window_bg}]#{@sep_l},#[bg=#{@window_bg}] }}"
set -g window-status-current-format "#[bg=#{@status_line_bg},fg=#{@window_current_bg}]#{@tab_l}#[bg=#{@window_current_bg},fg=#{@window_current_fg}]#{window_index} #{window_name}#[bg=#{@status_line_bg},fg=#{@window_current_bg}]#{@tab_r}"

# Clear window flair on window visit
set-hook -g session-window-changed 'set-option -w @window_flair ""'

set -g pane-border-format "#{?pane_active,#{@pane_l}#[fg=#{@pane_fg} bg=#{@pane_bg}] #{pane_index} #{pane_current_command} #[fg=#{@pane_bg} bg=default]#{@pane_r},#{pane_index} #{pane_current_command}}"
set -g pane-border-status "top"
set -g pane-border-style fg="#{@pane_bg}"
set -g pane-active-border-style fg="#{@pane_bg}"
